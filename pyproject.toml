[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-commodity-alpha"
version = "0.3.0"
description = "Weather-stress measurement and futures-overlay research for Arabica coffee"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Liam Son" }]
keywords = ["coffee", "commodities", "weather", "ERA5", "backtest", "agricultural-finance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "statsmodels>=0.14",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "requests>=2.31",
  "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Repository = "https://github.com/Liam-Son/coffee-commodity-alpha"

[tool.setuptools.packages.find]
include = ["src", "strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
